[package]
name = "remoteclient2"
version = "0.1.0"
edition = "2021"
description = "roBrowser Legacy remote client: GRF asset server + WebSocket-to-TCP proxy"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-deflate", "fs", "trace"] }
memmap2 = "0.9"
flate2 = "1"
encoding = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md5 = "0.7"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
base64 = "0.22"
bytes = "1"
parking_lot = "0.12"
regex = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
http-body-util = "0.1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
